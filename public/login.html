<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ring Dashboard · Sign in</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="login-main">
      <form id="login-form" class="card login-card" autocomplete="on">
        <h1>Ring Dashboard</h1>
        <p class="muted">Sign in to view your local Ring devices.</p>

        <label class="login-field">
          <span>Username</span>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            autofocus
            required
          />
        </label>

        <label class="login-field">
          <span>Password</span>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>

        <button id="login-button" type="submit">Sign in</button>

        <div id="login-status" class="login-status"></div>
      </form>
    </main>

    <script>
      const form = document.getElementById("login-form");
      const statusEl = document.getElementById("login-status");
      const button = document.getElementById("login-button");

      // If already authenticated (or auth is disabled), go straight in.
      fetch("/api/auth/status")
        .then((res) => res.json())
        .then((data) => {
          if (data && data.authenticated) {
            window.location.replace("/");
          }
        })
        .catch(() => {});

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusEl.innerHTML = "";
        button.disabled = true;

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value,
              password: document.getElementById("password").value,
            }),
          });

          const data = await response.json().catch(() => ({}));

          if (response.ok && data.ok) {
            window.location.replace("/");
            return;
          }

          statusEl.innerHTML =
            '<span class="badge bad">' +
            (data.error || "Sign in failed") +
            "</span>";
        } catch (error) {
          statusEl.innerHTML =
            '<span class="badge bad">Network error. Is the dashboard running?</span>';
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
