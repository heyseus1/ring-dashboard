services:
  ring-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ring-dashboard
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
